<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6feb" />
  <title>ぬりログ｜塗装現場 日報・写真アプリ</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- 設定（空ならデモ＝端末内保存、Supabaseキーがあれば本番＝クラウド）。モジュール前に読み込む -->
  <script src="js/config.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="icons/icon.svg" alt="" class="brand-logo" />
      <span class="brand-name">ぬりログ</span>
      <span class="sync-badge" id="syncBadge" hidden></span>
    </div>
    <div class="role-switch" id="roleSwitch">
      <button data-role="worker" class="active">職人</button>
      <button data-role="admin">管理者</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar"></nav>

  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
